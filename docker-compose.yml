services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: unravel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - PORT=8000
      - INNGEST_DEV=http://inngest:8288
      - INNGEST_BASE_URL=http://inngest:8288
    volumes:
      - ./server:/app
    depends_on:
      - inngest

  inngest:
    image: inngest/inngest:latest
    container_name: unravel-inngest
    restart: unless-stopped
    command: "inngest dev -u http://backend:8000/api/inngest --no-discovery"
    ports:
      - "8288:8288"
      - "8289:8289"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: unravel-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
      - inngest
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next