version: "3.8"

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev   # <-- Point to the dev Dockerfile
    container_name: unravel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - PORT=8000
    volumes:
      - ./server:/app             # <-- Syncs your local Python files live into the container

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: unravel-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next